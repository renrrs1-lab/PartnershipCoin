  <!-- finger lines -->
  <path d="M207 287 C217 294, 227 301, 238 307" stroke="#8a5b14" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M225 276 C236 283, 247 289, 259 295" stroke="#8a5b14" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M244 268 C255 274, 267 280, 279 285" stroke="#8a5b14" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M263 263 C274 268, 286 273, 297 278" stroke="#8a5b14" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M282 262 C293 266, 304 270, 314 274" stroke="#8a5b14" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M190 279 C205 262, 225 253, 246 250"
