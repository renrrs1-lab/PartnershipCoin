           C295 253, 282 249, 269 243
           C253 236, 235 235, 219 240
           C203 245, 188 256, 178 269
           C174 274, 172 280, 176 286 Z"
        fill="url(#gold)"
        stroke="#6f4810"
        stroke-width="4"
        stroke-linejoin="round"
