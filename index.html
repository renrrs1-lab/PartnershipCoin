<script>
  async function addMetaMask() {
    if (!window.ethereum) {
      alert("MetaMask not found. Please open this site using MetaMask browser.");
      return;
    }

    try {
      await window.ethereum.request({
        method: "wallet_watchAsset",
        params: {
          type: "ERC20",
          options: {
            address: "0x4A7CB744EE8f1B656A20940B80b368d5d8172875",
            symbol: "PARC",
            decimals: 18,
            image: "https://renrrs1-lab.github.io/PartnershipCoin/logo.svg"
          }
        }
      });
    } catch (err) {
      console.log(err);
      alert("Could not add PARC to MetaMask.");
    }
  }
</script>
